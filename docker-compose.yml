services:
  db:
    image: postgres:16-alpine
    container_name: ea-erp-db
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: ea_erp
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - erp_pgdata:/var/lib/postgresql/data
volumes:
  erp_pgdata:
